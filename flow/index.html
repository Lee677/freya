<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Flow — a generative sketch</title>
<meta name="description" content="A tiny generative-art sketch in p5.js, by @yuruyurau.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root{
    --bg:#090909;
    --ink:#eef1f8;
    --muted:#8b96ad;
    --line:rgba(255,255,255,.14);
    --accent:#8aa2ff;
    --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
    --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden}
  body{color:var(--ink);font-family:var(--sans)}

  /* the sketch fills the viewport entirely */
  canvas{position:fixed;top:0;left:0;display:block;z-index:0}

  .top{position:fixed;top:max(clamp(.9rem,3.5vw,1.5rem),env(safe-area-inset-top));
    left:max(clamp(.9rem,3.5vw,1.5rem),env(safe-area-inset-left));z-index:2}
  .home{appearance:none;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--muted);height:38px;padding:0 .8rem;border-radius:999px;display:inline-flex;align-items:center;
    gap:.4rem;transition:.3s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-family:var(--mono);font-size:.72rem;letter-spacing:.02em}
  .home:hover{color:var(--ink);border-color:var(--accent)}
  .home svg{width:14px;height:14px}

  .credit{position:fixed;left:0;right:0;bottom:max(clamp(1rem,4vw,1.8rem),env(safe-area-inset-bottom));
    z-index:2;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:.25rem;text-align:center;
    font-family:var(--mono);font-size:.72rem;letter-spacing:.03em;color:var(--muted);
    text-shadow:0 2px 14px rgba(0,0,0,.9)}
  .credit a{pointer-events:auto;color:var(--accent);text-decoration:none;
    border-bottom:1px solid rgba(138,162,255,.35);padding-bottom:1px;transition:.2s}
  .credit a:hover{border-color:var(--accent)}
  .credit .title{font-family:var(--serif);font-size:1rem;color:var(--ink);letter-spacing:.01em}

  @media (max-width:520px){
    .home .t{display:none}
    .home{width:38px;padding:0;justify-content:center}
  }
</style>

</head>
<body>

<div class="top">
  <a class="home" href="https://freya.co.nz" title="Back to freya.co.nz" aria-label="Back to freya.co.nz">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span class="t">freya.co.nz</span>
  </a>
</div>

<div class="credit">
  <span class="title">Flow</span>
  <span>Original generative-art sketch by
    <a href="https://x.com/yuruyurau?s=11" target="_blank" rel="noopener noreferrer">@yuruyurau</a>
  </span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
/*
  Reconstructed from a hand-typed, character-limited p5.js sketch by @yuruyurau
  (https://x.com/yuruyurau?s=11).

  The generative math below is verbatim from the original — only unpacked from
  its one-line, default-argument form so the point coordinates can be reused for
  auto-fitting. Everything added here is presentation: a full-viewport canvas,
  and a measured fit so the figure sits centred at any screen size.
*/

let t = 0;
let i = 0;
let fit = { s: 1, cx: 200, cy: 200, bw: 400, bh: 400 };

// Original math, unchanged. Uses the global `i` exactly as the source does.
function px(y){
  const e = y / 7 - 13;
  const k = (4 + cos(i / 9 - t * 2)) * cos(i / 35);
  const d = mag(k, e) + sin(e / 9 + t / 2) - 4;
  const q = 2 * sin(k * 3) - y / 35 * k * (9 + k * sin(cos(e) * 9 - d * 2 + t));
  const c = d - t;
  return [q + 40 * cos(c) + 200, q * sin(c) + d * 35];
}

// Sample the figure across a full animation cycle to find its true bounds,
// so centring never depends on hand-guessed numbers.
function measure(){
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const saveT = t, saveI = i;
  for(let tt = 0; tt < TWO_PI * 2; tt += TWO_PI / 24){
    t = tt;
    for(i = 1e4; i > 0; i -= 20){
      const p = px(i / 235);
      if(p[0] < minX) minX = p[0];
      if(p[0] > maxX) maxX = p[0];
      if(p[1] < minY) minY = p[1];
      if(p[1] > maxY) maxY = p[1];
    }
  }
  t = saveT; i = saveI;
  fit.cx = (minX + maxX) / 2;
  fit.cy = (minY + maxY) / 2;
  fit.bw = maxX - minX;
  fit.bh = maxY - minY;
}

function applyFit(){
  // contain-fit against the figure's full-cycle bounds, so it fills the
  // screen on desktop and on portrait phones alike without ever cropping
  fit.s = Math.min(width / fit.bw, height / fit.bh) * 0.95;
}

function setup(){
  createCanvas(windowWidth, windowHeight);
  measure();
  applyFit();
}

function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
  applyFit();
}

function draw(){
  background(9);
  stroke(255, 96);
  push();
  translate(width / 2, height / 2);
  scale(fit.s);
  translate(-fit.cx, -fit.cy);
  t += PI / 80;
  for(i = 1e4; i--;){
    const p = px(i / 235);
    point(p[0], p[1]);
  }
  pop();
}
</script>

</body>
</html>
