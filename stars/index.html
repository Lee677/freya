<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Guide</title>
<style>
  :root { --ink:#c7d0e0; --accent:#6fb3ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:#04060f; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; }
  .screen-wrap { width:100vw; height:100vh; height:100dvh; overflow:hidden; position:relative;
    cursor:grab; background:#04060f; touch-action:none; }
  .screen-wrap:active { cursor:grabbing; }
  canvas { display:block; width:100%; height:100%; position:absolute; inset:0; }

  #ui { position:absolute; inset:0; pointer-events:none; }
  .starcard { position:absolute; left:50%; top:7%; transform:translateX(-50%); width:auto; max-width:80vw;
    background:linear-gradient(135deg,rgba(10,16,32,0.72),rgba(20,10,36,0.72)); border:1px solid rgba(120,230,255,0.45); border-radius:4px;
    padding:8px 20px; backdrop-filter:blur(6px); opacity:0; transition:opacity 0.25s; pointer-events:none; text-align:center; z-index:6;
    box-shadow:0 0 22px rgba(60,200,255,0.25), inset 0 0 12px rgba(120,230,255,0.08); }
  .starcard::before{ content:""; position:absolute; left:-1px; top:6px; bottom:6px; width:2px; background:linear-gradient(180deg,#38e0ff,#c86bff); box-shadow:0 0 8px #38e0ff; }
  .starcard::after{ content:""; position:absolute; right:-1px; top:6px; bottom:6px; width:2px; background:linear-gradient(180deg,#c86bff,#38e0ff); box-shadow:0 0 8px #c86bff; }
  .starcard.show { opacity:1; }
  .starcard .nm { font-size:16px; font-weight:700; color:#eafcff; letter-spacing:0.14em; text-transform:uppercase;
    text-shadow:0 0 12px rgba(80,220,255,0.7); font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; }
  .starcard { display:none !important; }
  #terminalReadout { position:absolute; left:12px; top:12px; z-index:9; pointer-events:none; opacity:0; transition:opacity .12s;
    font-family:"VT323","Courier New",ui-monospace,monospace; font-size:15px; color:#7fff9f;
    text-shadow:0 0 6px rgba(80,255,120,0.7); letter-spacing:0.08em; line-height:1.35; white-space:pre;
    background:transparent; border:none; padding:0; }
  #terminalReadout.show { opacity:0.95; }
  #terminalReadout .cmd { color:#5aff7f; }
  #terminalReadout .val { color:#a5ffb0; }
  #terminalReadout .btn { color:#7fff9f; cursor:pointer; pointer-events:auto; text-decoration:none;
    display:inline-block; padding:2px 0; border-bottom:1px solid rgba(80,255,120,0.4); margin-top:4px; }
  #terminalReadout .btn:hover { color:#eafcff; border-bottom-color:#eafcff; text-shadow:0 0 10px rgba(120,255,180,0.9); }
  .view3d-btn { display:inline-block; margin-top:8px; padding:5px 12px; font-family:ui-monospace,Menlo,monospace; font-size:11px;
    letter-spacing:0.16em; color:#8fd4ff; border:1px solid rgba(120,230,255,0.5); background:rgba(20,40,70,0.4);
    border-radius:3px; cursor:pointer; pointer-events:auto; text-shadow:0 0 8px rgba(80,220,255,0.6); }
  .view3d-btn:hover { background:rgba(60,120,200,0.4); color:#eafcff; box-shadow:0 0 12px rgba(80,220,255,0.5); }

  #view3dOverlay{ position:absolute; inset:0; background:rgba(2,4,10,0.94); backdrop-filter:blur(6px); z-index:25;
    display:none; align-items:center; justify-content:center; pointer-events:auto; }
  #view3dOverlay.show{ display:flex; }
  #view3dPanel{ align-items:center; justify-content:center; background:linear-gradient(160deg,#050810,#0a0616); border:1px solid rgba(120,230,255,0.4); border-radius:8px; overflow:hidden;
    box-shadow:0 0 60px rgba(60,180,255,0.3); display:flex; flex-direction:column; max-width:96vw; max-height:96vh; }
  #view3dHeader{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid rgba(120,230,255,0.2); }
  #view3dTitle{ font-family:ui-monospace,Menlo,monospace; font-size:13px; color:#9fe8ff; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; text-shadow:0 0 10px rgba(80,220,255,0.5); }
  #view3dClose{ cursor:pointer; color:#8fd4ff; font-size:18px; padding:2px 10px; border-radius:6px; }
  #view3dClose:hover{ background:rgba(120,230,255,0.15); color:#fff; }
  #view3dCanvas{ display:block; margin:auto; width:min(600px,80vw,80vh); height:min(600px,80vw,80vh); aspect-ratio:1/1; background:#000; cursor:grab; touch-action:none; }
  #view3dCanvas:active{ cursor:grabbing; }
  #view3dFoot{ padding:10px 20px; border-top:1px solid rgba(120,230,255,0.2); font-family:ui-monospace,Menlo,monospace; font-size:11px; color:#8fd4ff; text-align:center; letter-spacing:0.1em; }
  .iconbtn { position:absolute; width:44px; height:44px; border-radius:9px; border:1px solid rgba(120,200,255,0.28);
    background:linear-gradient(135deg,rgba(12,20,36,0.66),rgba(22,12,40,0.66)); color:#8fd4ff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter:blur(5px); transition:all .18s; pointer-events:auto; transform:translate(-50%,-50%);
    box-shadow:0 0 12px rgba(50,160,255,0.12); }
  .iconbtn:hover { background:linear-gradient(135deg,rgba(30,50,80,0.85),rgba(40,20,70,0.85)); box-shadow:0 0 18px rgba(80,200,255,0.4); color:#d6f4ff; }
  .iconbtn.on { border-color:rgba(120,255,220,0.7); color:#c8fff0; box-shadow:0 0 16px rgba(60,255,200,0.5), inset 0 0 10px rgba(60,255,200,0.15); }
  .iconbtn svg { width:21px; height:21px; }
  code { background:#11141a; padding:1px 6px; border-radius:5px; color:#9fb3d6; font-size:12px; }
  #hoverTip { position:absolute; pointer-events:none; z-index:8; opacity:0; transition:opacity .12s;
    font-family:"VT323","Courier New",ui-monospace,monospace; font-size:14px; color:#7fff9f;
    text-shadow:0 0 6px rgba(80,255,120,0.6); background:transparent; border:none; padding:0; white-space:nowrap; letter-spacing:0.06em; }
  #hoverTip.show{ opacity:0.95; }

  #mapOverlay{ position:absolute; inset:0; background:rgba(2,4,10,0.82); backdrop-filter:blur(4px); z-index:20;
    display:none; align-items:center; justify-content:center; pointer-events:auto; }
  #mapOverlay.show{ display:flex; }
  #mapPanel{ width:98vw; height:96vh; background:linear-gradient(160deg,#050810,#0a0616); border:1px solid rgba(120,230,255,0.35); border-radius:8px; overflow:hidden;
    box-shadow:0 0 60px rgba(60,180,255,0.3); display:flex; flex-direction:column; }
  #mapHeader{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid rgba(120,230,255,0.18); flex:0 0 auto; }
  #mapTitle{ font-size:13px; color:#9fe8ff; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; font-family:ui-monospace,Menlo,monospace; text-shadow:0 0 10px rgba(80,220,255,0.5); }
  #mapClose{ cursor:pointer; color:#8fd4ff; font-size:18px; padding:2px 10px; border-radius:6px; }
  #mapClose:hover{ background:rgba(120,230,255,0.12); color:#fff; }
  #mapWrap{ position:relative; background:#020408; display:flex; justify-content:center; align-items:center; flex:1 1 auto; overflow:hidden; }
  #mapCanvas{ display:block; margin:auto; aspect-ratio:1/1; width:min(88vh,88vw,720px); height:min(88vh,88vw,720px); cursor:grab; touch-action:none; }
  #mapCanvas:active{ cursor:grabbing; }
  #mapFoot{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; gap:12px; border-top:1px solid rgba(120,230,255,0.18); flex:0 0 auto; }
  #mapLoc{ font-size:13px; color:#9fb3d6; }
  #mapGo{ background:linear-gradient(180deg,#6fb3ff,#3d7ad6); color:#fff; border:none; border-radius:7px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  #mapGo:hover{ filter:brightness(1.1); }
  /* portrait-only on phones: web can't hard-lock orientation, so we show a rotate-back screen */
  #rotateOverlay{ display:none; position:fixed; inset:0; z-index:99; background:#04050c; color:#7fff9f;
    font-family:ui-monospace,Menlo,monospace; text-align:center; padding-top:20vh; font-size:16px; letter-spacing:0.08em;
    text-shadow:0 0 8px rgba(80,255,120,0.7); }
  @media (orientation:landscape) and (pointer:coarse) and (max-height:520px){ #rotateOverlay{ display:block; } }
</style>
</head>

      <div id="rotateOverlay">↻<br><br>ROTATE BACK TO PORTRAIT<br><br><span style="font-size:11px;opacity:0.7">this sky is built for holding your phone up</span></div>
      <div id="terminalReadout"></div>
    </div>

    <!-- 3D body viewer overlay -->
    <div id="view3dOverlay">
      <div id="view3dPanel">
        <div id="view3dHeader"><span id="view3dTitle">—</span><span id="view3dClose">✕</span></div>
        <canvas id="view3dCanvas" width="600" height="600"></canvas>
        <div id="view3dFoot"><span id="view3dInfo">drag to rotate · scroll to zoom</span></div>
      </div>
    </div>

    <!-- Location picker overlay -->
    <div id="mapOverlay">
      <div id="mapPanel">
        <div id="mapHeader">

        <div id="mapFoot"><span id="mapLoc">Auckland · −36.8°, 174.8°</span><button id="mapGo">See these stars ▸</button></div>
      </div>
    </div>
  </div>

    // fill straight DOWN to the bottom of the screen. No closePath across culled gaps.

      ctx.lineTo(run[0].x-1, H+4);

  // element category → colour (rough IUPAC/CPK colour scheme, made brighter for the cyberpunk vibe)
  function elemCategory(z){
    if(z===1) return "nonmetal";
    if(z===2||z===10||z===18||z===36||z===54||z===86||z===118) return "noble";
    if([3,11,19,37,55,87].includes(z)) return "alkali";
    if([4,12,20,38,56,88].includes(z)) return "alkaline";
    if(z>=57&&z<=71) return "lanthanide";
    if(z>=89&&z<=103) return "actinide";
    if((z>=21&&z<=30)||(z>=39&&z<=48)||(z>=72&&z<=80)||(z>=104&&z<=112)) return "transition";
    if([13,31,49,50,81,82,83,113,114,115,116].includes(z)) return "postmetal";
    if([5,14,32,33,51,52,84].includes(z)) return "metalloid";
    if([6,7,8,15,16,34].includes(z)) return "nonmetal";
    if([9,17,35,53,85,117].includes(z)) return "halogen";
    return "unknown";
  }

  // real electron shell configuration (K,L,M,N,O,P,Q for shells 1..7) — computed from Aufbau order
  function electronConfig(z){
    // shells max capacity (2n^2): 2, 8, 18, 32, 32, 18, 8 — but actual filling follows Aufbau
    // simplified Aufbau: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p
    const orbitals=[["1s",1,2],["2s",2,2],["2p",2,6],["3s",3,2],["3p",3,6],["4s",4,2],["3d",3,10],["4p",4,6],["5s",5,2],["4d",4,10],["5p",5,6],["6s",6,2],["4f",4,14],["5d",5,10],["6p",6,6],["7s",7,2],["5f",5,14],["6d",6,10],["7p",7,6]];
    const shells=[0,0,0,0,0,0,0]; let left=z;
    for(const [_,n,cap] of orbitals){ const put=Math.min(left,cap); shells[n-1]+=put; left-=put; if(left<=0)break; }
    return shells.filter(s=>s>0);
  }
  // periodic table layout in row/col for the classic 18-column IUPAC grid, plus rows 8/9 for lanth/act
  function tableCell(z){
    const e=ELDATA[z-1]; if(!e) return null;
    const [sym,name,mass,period,group,radio]=e;
    let row,col;
    if(group===-1){ row=8; col=z-56; }        // lanthanides La(57)..Lu(71) -> cols 3..17
    else if(group===-2){ row=9; col=z-88; }   // actinides Ac(89)..Lr(103) -> cols 3..17
    else { row=period; col=group; }
    return {sym,name,mass,period,group,radio,row,col};
  }

  // hit-test for the periodic table (returns element z if hit)
  function tableHitTest(px,py){
    const {tx,ty,tw,th,cw,ch}=tableGeom();
    if(py<ty || py>ty+th || px<tx || px>tx+tw) return null;
    const c=Math.floor((px-tx)/cw)+1, r=Math.floor((py-ty)/ch)+1;
    // find element at row/col
    for(let z=1;z<=118;z++){ const cell=tableCell(z); if(cell && cell.row===r && cell.col===c) return z; }
    return null;
  }
  function tableGeom(){
    // smaller table so the atom below has proper breathing room
    const maxW=Math.min(W-60, 640);
    const cw=Math.min(34, maxW/18);
    const ch=cw*1.15;
    const tw=cw*18, th=ch*9;
    const tx=(W-tw)/2, ty=12;
    return {tx,ty,tw,th,cw,ch};
  }

  // ---- GALAXY view: spiral of stars, home marked ----
  // ---- SOLAR SYSTEM view: sun in centre, planets orbiting at real relative periods ----
  const SS_PLANETS = [
    // [name, orbit radius (relative), period (years), radius, colour, has ring, starting phase (radians)]
    ["Mercury",  0.10, 0.24,  2, "#b8b0a0", false, 0.2],
    ["Venus",    0.16, 0.62,  4, "#f0d090", false, 1.9],
    ["Earth",    0.22, 1.00,  4, "#6faaff", false, 3.4],

  function drawSolarSystem(){
    ctx.fillStyle="#010208"; ctx.fillRect(0,0,W,H);
    for(let i=0;i<220;i++){ const x=(i*97+t*3)%W, y=(i*53+t*2.1)%H;
      ctx.fillStyle="rgba(200,220,255,"+(0.15+0.55*Math.sin(t+i))+")"; ctx.fillRect(x,y,1,1); }
    const cx=CX, cy=CY, maxR=Math.min(W,H)*0.42;
    const tilt=0.55;   // stronger tilt for better 3D read
    const sunR=14;
    for(let i=3;i>0;i--){ const gg=ctx.createRadialGradient(cx,cy,sunR*0.5,cx,cy,sunR*(2+i));
      gg.addColorStop(0,"rgba(255,220,120,"+(0.25/i)+")"); gg.addColorStop(1,"rgba(255,220,120,0)");
      ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cx,cy,sunR*(2+i),0,7); ctx.fill(); }
    const sg=ctx.createRadialGradient(cx-3,cy-3,2,cx,cy,sunR);
    sg.addColorStop(0,"#fffdea"); sg.addColorStop(0.7,"#ffcc44"); sg.addColorStop(1,"#ff7020");
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(cx,cy,sunR,0,7); ctx.fill();
    const bodies=[];
    for(const p of SS_PLANETS){
      const r = p[1]*maxR;
      // orbit ellipse — tilted (visible as an ellipse)
      ctx.strokeStyle="rgba(140,180,235,0.25)"; ctx.lineWidth=1;
      ctx.beginPath();
      for(let a=0;a<=Math.PI*2+0.02;a+=0.08){
        const x = Math.cos(a)*r;
        const yr = Math.sin(a)*r*Math.cos(tilt);
        a===0?ctx.moveTo(cx+x, cy+yr):ctx.lineTo(cx+x, cy+yr);
      }
      ctx.stroke();
      // planet position: seeded starting phase + orbital motion (faster time so you can SEE it)
      const a = p[6] + t*0.4 * (1.0/p[2]);
      const x = Math.cos(a)*r;
      const yr = Math.sin(a)*r*Math.cos(tilt);
      const z = Math.sin(a)*r*Math.sin(tilt);
      bodies.push({name:p[0], x:cx+x, y:cy+yr, z, rad:p[3], col:p[4], ring:p[5]});
    }
    bodies.sort((a,b)=>a.z-b.z);
    for(const b of bodies){
      const depth=(b.z/maxR+1)*0.5;
      const shade=0.65+depth*0.35;
      const g=ctx.createRadialGradient(b.x-b.rad*0.4,b.y-b.rad*0.4,1,b.x,b.y,b.rad);
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.4, b.col);
      g.addColorStop(1, hexA(b.col, 0.4));
      ctx.globalAlpha=shade;
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,b.rad,0,7); ctx.fill();
      if(b.ring){
        ctx.strokeStyle=hexA(b.col,0.7); ctx.lineWidth=1.2;
        ctx.save(); ctx.translate(b.x,b.y); ctx.scale(1, Math.cos(tilt)); ctx.beginPath(); ctx.arc(0,0,b.rad*2.1,0,7); ctx.stroke(); ctx.restore();
      }
      ctx.globalAlpha=1;
      // label offset by the sign of z so it stays clear of other planets
      // above the planet if on the far side, below if on the near side
      const labelY = b.y + (b.z>0 ? b.rad+12 : -b.rad-4);
      ctx.fillStyle="rgba(220,235,255,0.9)"; ctx.font="11px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
      // small dark outline for readability
      ctx.strokeStyle="rgba(0,0,0,0.7)"; ctx.lineWidth=3; ctx.strokeText(b.name, b.x, labelY);
      ctx.fillText(b.name, b.x, labelY);
    }
    ctx.fillStyle="rgba(220,240,255,0.9)"; ctx.font="bold 16px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText("THE SOLAR SYSTEM", CX, 40);
    ctx.fillStyle="rgba(180,210,240,0.6)"; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText("scroll in for the sky · scroll out for the galaxy", CX, H-18);
    ctx.textAlign="left";
  }

  function drawGalaxy(){
    ctx.fillStyle="#02030a"; ctx.fillRect(0,0,W,H);

    const g=ctx.createRadialGradient(cx,cy,5,cx,cy,R*0.9);

    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*0.9,0,7); ctx.fill();
    // spiral arms
    const arms=2, spin=t*0.03;
    for(let a=0;a<arms;a++){
      for(let i=0;i<900;i++){
        const dist=(i/900)*R*0.85;
        const ang=spin + a*Math.PI + i*0.017 + dist*0.012;
        const jitter=(Math.sin(i*12.9)*0.5)*0.35;
        const x=cx+Math.cos(ang+jitter)*dist, y=cy+Math.sin(ang+jitter)*dist*0.55;  // squashed = tilted disc
        const b=0.3+0.7*Math.sin(i*7.7)*Math.sin(i*3.3);

        const sz=Math.random()<0.05?1.8:0.8;
        ctx.fillRect(x,y,sz,sz);
      }
    }
    // home marker
    const hx=cx+Math.cos(spin+0.6)*R*0.5, hy=cy+Math.sin(spin+0.6)*R*0.5*0.55;
    const pulse=0.5+0.5*Math.sin(t*3);
    ctx.strokeStyle="rgba(255,230,90,"+(0.4+0.5*pulse)+")"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(hx,hy,8+pulse*4,0,7); ctx.stroke();

    ctx.textAlign="left";
  }

  // ---- UNIVERSE view: cosmic web of galaxies ----
  function drawUniverse(){
    ctx.fillStyle="#01010a"; ctx.fillRect(0,0,W,H);
    // faint filament web
    for(let i=0;i<260;i++){
      const seed=i*127.1;
      const x=(Math.sin(seed)*0.5+0.5)*W, y=(Math.cos(seed*1.7)*0.5+0.5)*H;
      const drift=Math.sin(t*0.1+i)*4;
      const type=i%9;
      // galaxy sprite: little tilted disc
      ctx.save(); ctx.translate(x+drift,y); ctx.rotate(seed);
      const sz=2+ (i%13===0?6:2)*Math.abs(Math.sin(seed));
      const hue= type<3?40: type<6?210: 300;
      const g=ctx.createRadialGradient(0,0,0,0,0,sz*2.4);
      g.addColorStop(0,"hsla("+hue+",70%,80%,0.9)"); g.addColorStop(0.4,"hsla("+hue+",70%,60%,0.4)"); g.addColorStop(1,"hsla("+hue+",70%,40%,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,sz*2.4,sz*1.1,0,0,7); ctx.fill();
      ctx.restore();
    }
    // faint connecting filaments (cosmic web)
    ctx.strokeStyle="rgba(90,110,180,0.06)"; ctx.lineWidth=1;
    for(let i=0;i<60;i++){ const s=i*311.7; const x1=(Math.sin(s)*0.5+0.5)*W,y1=(Math.cos(s*1.3)*0.5+0.5)*H,x2=(Math.sin(s*2.1)*0.5+0.5)*W,y2=(Math.cos(s*0.9)*0.5+0.5)*H;
      if(Math.hypot(x2-x1,y2-y1)<W*0.25){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); } }
    ctx.fillStyle="rgba(200,220,255,0.85)"; ctx.font="bold 16px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText("THE OBSERVABLE UNIVERSE", CX, 40);
    ctx.fillStyle="rgba(180,200,235,0.6)"; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText("every speck is a galaxy · ~2 trillion of them · scroll in to come back", CX, H-18);
    ctx.textAlign="left";
  }

  // ---- CELL view: a living cell with organelles ----
  function drawCell(){
    ctx.fillStyle="#0a0810"; ctx.fillRect(0,0,W,H);
    const cx=CX, cy=CY, cr=Math.min(W,H)*0.42;
    // cytoplasm
    const g=ctx.createRadialGradient(cx-cr*0.2,cy-cr*0.2,cr*0.1,cx,cy,cr);
    g.addColorStop(0,"rgba(120,180,220,0.30)"); g.addColorStop(0.7,"rgba(80,140,190,0.20)"); g.addColorStop(1,"rgba(40,90,140,0.10)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,cr,0,7); ctx.fill();
    // membrane
    ctx.strokeStyle="rgba(150,220,255,0.6)"; ctx.lineWidth=3; ctx.beginPath();
    for(let a=0;a<=Math.PI*2+0.01;a+=0.08){ const wob=1+0.02*Math.sin(a*8+t); const x=cx+Math.cos(a)*cr*wob, y=cy+Math.sin(a)*cr*wob; a===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke();
    // nucleus (with the DNA hint inside)
    const nx=cx+Math.sin(t*0.3)*20, ny=cy+Math.cos(t*0.25)*16, nr=cr*0.32;
    const ng=ctx.createRadialGradient(nx,ny,2,nx,ny,nr);
    ng.addColorStop(0,"rgba(180,140,220,0.8)"); ng.addColorStop(1,"rgba(90,60,140,0.5)");
    ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(nx,ny,nr,0,7); ctx.fill();
    ctx.strokeStyle="rgba(210,170,255,0.7)"; ctx.lineWidth=2; ctx.stroke();
    // chromatin squiggles in nucleus
    ctx.strokeStyle="rgba(230,190,255,0.5)"; ctx.lineWidth=1.4;
    for(let c=0;c<6;c++){ ctx.beginPath(); for(let s=0;s<20;s++){ const a=c*1.7+s*0.4+t*0.2; const rr=nr*0.7*(s/20); const x=nx+Math.cos(a)*rr, y=ny+Math.sin(a)*rr; s===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }
    // mitochondria (bean shapes)
    for(let i=0;i<7;i++){ const a=i*0.9+t*0.1, d=cr*(0.5+0.12*Math.sin(i*3)); const mx=cx+Math.cos(a)*d, my=cy+Math.sin(a)*d;
      ctx.save(); ctx.translate(mx,my); ctx.rotate(a+1); ctx.fillStyle="rgba(255,170,120,0.7)"; ctx.beginPath(); ctx.ellipse(0,0,16,8,0,0,7); ctx.fill();
      ctx.strokeStyle="rgba(255,210,160,0.6)"; ctx.lineWidth=1; for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(k*5,-6); ctx.lineTo(k*5+3,6); ctx.stroke(); } ctx.restore(); }
    // floating vesicles
    for(let i=0;i<14;i++){ const a=i*2.1+t*0.3, d=cr*(0.3+0.5*((i*7)%10)/10); const vx=cx+Math.cos(a)*d, vy=cy+Math.sin(a)*d;
      ctx.fillStyle="rgba(150,220,255,0.25)"; ctx.beginPath(); ctx.arc(vx,vy,4+i%3,0,7); ctx.fill(); }
    ctx.fillStyle="rgba(200,235,255,0.9)"; ctx.font="bold 16px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText("A LIVING CELL", cx, 40);
    ctx.fillStyle="rgba(180,220,235,0.6)"; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText("scroll in for the DNA in the nucleus · scroll out for the sky", cx, H-18);
    ctx.textAlign="left";
  }

  // ---- DNA view: rotating double helix (blue→purple, tapered ends) ----
  function drawDNA(){
    ctx.fillStyle="#05060f"; ctx.fillRect(0,0,W,H);
    const cx=CX, topY=90, botY=H-70, len=botY-topY;
    const turns=4, ampMax=Math.min(W*0.22,150);
    const baseCols={A:"#7f9dff",T:"#b48bff",G:"#5ad2ff",C:"#d06fff"};
    const pairs=[["A","T"],["T","A"],["G","C"],["C","G"]];
    const rungs=[];
    const steps=46;
    for(let i=0;i<=steps;i++){
      const f=i/steps, y=topY+f*len;
      // taper: envelope narrows at both ends + slight random wobble per rung
      const env=Math.sin(f*Math.PI);
      const amp=ampMax*(0.25+0.75*env) * (1+0.06*Math.sin(i*7.3));
      const ang=f*Math.PI*2*turns + t*1.2;
      const x1=cx+Math.cos(ang)*amp, z1=Math.sin(ang);
      const x2=cx+Math.cos(ang+Math.PI)*amp, z2=Math.sin(ang+Math.PI);
      rungs.push({y,x1,z1,x2,z2,pr:pairs[i%pairs.length]});
    }
    // backbones: blue→purple vertical gradient ribbons
    for(const side of [0,1]){
      const grad=ctx.createLinearGradient(0,topY,0,botY);
      grad.addColorStop(0, side? "rgba(120,140,255,0.75)":"rgba(90,190,255,0.75)");
      grad.addColorStop(1, side? "rgba(190,90,255,0.75)":"rgba(150,90,255,0.75)");
      ctx.strokeStyle=grad;
      ctx.beginPath();
      for(let i=0;i<=steps;i++){ const r=rungs[i]; const x=side?r.x2:r.x1;
        i===0?ctx.moveTo(x,r.y):ctx.lineTo(x,r.y); }
      ctx.lineWidth=3; ctx.stroke();
    }
    rungs.map((r)=>({r,z:(r.z1+r.z2)/2})).sort((a,b)=>a.z-b.z).forEach(({r})=>{
      const depth=((r.z1+r.z2)/2+1)/2;
      ctx.strokeStyle="rgba(170,150,255,"+(0.12+depth*0.4)+")"; ctx.lineWidth=1+depth*3;
      ctx.beginPath(); ctx.moveTo(r.x1,r.y); ctx.lineTo(r.x2,r.y); ctx.stroke();
      const s1=3+((r.z1+1)/2)*4, s2=3+((r.z2+1)/2)*4;
      // blobby nucleotides: slightly irregular
      const wob1=1+0.25*Math.sin(r.y*0.4+t*2), wob2=1+0.25*Math.cos(r.y*0.35+t*1.7);
      ctx.fillStyle=baseCols[r.pr[0]]; ctx.beginPath(); ctx.ellipse(r.x1,r.y,s1*wob1,s1/wob1,r.y*0.1,0,7); ctx.fill();
      ctx.fillStyle=baseCols[r.pr[1]]; ctx.beginPath(); ctx.ellipse(r.x2,r.y,s2*wob2,s2/wob2,-r.y*0.1,0,7); ctx.fill();
    });
    ctx.fillStyle="rgba(200,190,255,0.95)"; ctx.font="bold 16px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText("DNA · THE DOUBLE HELIX", cx, 40);
    ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillStyle=baseCols.A; ctx.fillText("A", cx-60, 62); ctx.fillStyle=baseCols.T; ctx.fillText("T", cx-40, 62);
    ctx.fillStyle=baseCols.G; ctx.fillText("G", cx-20, 62); ctx.fillStyle=baseCols.C; ctx.fillText("C", cx, 62);
    ctx.fillStyle="rgba(190,180,235,0.6)"; ctx.fillText("carbon is the backbone of all of this · tap to close", cx, H-18);
    ctx.textAlign="left";
  }

  function drawSubatomic(){
    // black backdrop with subtle quantum haze
    ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);

    if(elemScene){ drawElementScene(elemScene); requestAnimationFrame && 0; }
    else if(subDepth===0){
      drawPeriodicTable();
      drawAtomFor(selectedZ);
    } else if(subDepth===1){
      drawZoomedNucleus(selectedZ);
    } else if(subDepth===2){
      drawQuarks();
    } else if(subDepth>=3){
      drawTheAnswer();
    }
    if(elemScene){ /* scene hint */ ctx.fillStyle="rgba(180,220,255,0.7)"; ctx.font="11px ui-monospace,Menlo,monospace"; ctx.textAlign="center"; ctx.fillText("[ tap anywhere to close ]", CX, H-40); ctx.textAlign="left"; }

    // hint text at the bottom
    ctx.fillStyle="rgba(180,220,255,0.7)"; ctx.font="11px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    const hint = subDepth===0 ? "[ SUBATOMIC · tap an element · click a proton to go deeper · scroll out to escape ]"
              : subDepth===1 ? "[ NUCLEUS · click a proton to see its quarks · scroll out to go back ]"
              : subDepth===2 ? "[ QUARKS · click to go deeper · scroll out to go back ]"
              : "[ 42 · scroll out to escape ]";
    ctx.fillText(hint, CX, H-16);
    ctx.textAlign="left";
  }

  function drawPeriodicTable(){
    const {tx,ty,cw,ch}=tableGeom();
    for(let z=1;z<=118;z++){
      const cell=tableCell(z); if(!cell) continue;
      const x=tx+(cell.col-1)*cw, y=ty+(cell.row-1)*ch;
      const cat=elemCategory(z); const col=CAT_COL[cat]||"#888";
      const isSel = z===selectedZ;
      // background
      ctx.fillStyle= isSel ? col : hexA(col,0.18);
      ctx.fillRect(x+1,y+1,cw-2,ch-2);
      // border
      ctx.strokeStyle= isSel ? "#fff" : hexA(col,0.55); ctx.lineWidth= isSel?1.4:0.8;
      ctx.strokeRect(x+1,y+1,cw-2,ch-2);
      // radioactive: warning stripes + green glow pulse
      if(cell.radio){
        ctx.save();
        const pulse=0.5+0.5*Math.sin(t*4+z);
        ctx.strokeStyle="rgba(120,255,120,"+(0.15+0.35*pulse)+")"; ctx.lineWidth=1.2;
        ctx.strokeRect(x+0.5,y+0.5,cw-1,ch-1);
        // diagonal warning lines
        ctx.strokeStyle="rgba(255,255,0,0.15)"; ctx.lineWidth=1;
        for(let s=-cw;s<cw*2;s+=6){ ctx.beginPath(); ctx.moveTo(x+s,y); ctx.lineTo(x+s+ch,y+ch); ctx.stroke(); }
        ctx.restore();
      }
      // atomic number (top-left)
      ctx.fillStyle= isSel?"#0a0a0a":"rgba(220,240,255,0.85)"; ctx.font="9px ui-monospace,Menlo,monospace"; ctx.textAlign="left";
      ctx.fillText(String(z), x+3, y+10);
      // symbol (centre)
      ctx.fillStyle= isSel?"#0a0a0a":"#eafcff"; ctx.font= (cw>36?"bold 15px":"bold 12px")+" ui-monospace,Menlo,monospace"; ctx.textAlign="center";
      ctx.fillText(cell.sym, x+cw/2, y+ch*0.65);
      // mass (bottom, tiny)
      if(cw>34){ ctx.fillStyle= isSel?"rgba(30,30,30,0.7)":"rgba(180,200,235,0.6)"; ctx.font="8px ui-monospace,Menlo,monospace"; ctx.fillText(String(cell.mass), x+cw/2, y+ch-3); }
    }
    ctx.textAlign="left";
    // gap indicator for lanth/act row
    const gapY=ty+2*ch;
    // (visual gap already present because rows 8/9 sit below main table)
  }

  // draw the atom for the selected element with real electron shells
  function drawAtomFor(z){
    const cell=tableCell(z); if(!cell) return;
    const tg=tableGeom();
    const tableBottom = tg.ty + tg.th;
    // gap between table and label block, then labels, then more gap, then atom
    const labelY = tableBottom + 24;    // element name line
    const factsY = labelY + 24;         // facts line
    const factsY2 = factsY + 20;
    const atomTop = factsY2 + 22;
    // atom centre so shells fit vertically to bottom of screen
    const spaceForAtom = H - atomTop - 40;
    const cfg=electronConfig(z);
    const nR=Math.min(60, 16+Math.sqrt(z + Math.max(0, Math.round(cell.mass)-z))*3);
    // shells radius: fit within available vertical space (halved because it's an ellipse height)
    const maxR = Math.min(R*0.6, spaceForAtom/2 * (1/0.32));   // shells are squashed to 0.32
    const ax=CX, ay=atomTop + spaceForAtom/2;
    const protons=z, neutrons=Math.max(0, Math.round(cell.mass)-z);
    const cat=elemCategory(z);
    const isRadio=cell.radio;
    // labels ABOVE the atom (between table and atom)
    ctx.fillStyle=CAT_COL[cat]; ctx.font="bold 22px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText(cell.name.toUpperCase(), ax, labelY);
    ctx.fillStyle="rgba(220,240,255,0.85)"; ctx.font="12px ui-monospace,Menlo,monospace";
    ctx.fillText(cell.sym+"  ·  Z="+z+"  ·  A="+cell.mass+"  ·  "+cat.toUpperCase()+(isRadio?"  ·  ☢ RADIOACTIVE":""), ax, factsY);
    ctx.fillText("protons "+protons+"  ·  neutrons "+neutrons+"  ·  electrons "+z+"  ·  shells "+cfg.join(","), ax, factsY2);
    // background glow (radioactive pulse if radioactive)
    if(isRadio){ const pulse=0.5+0.5*Math.sin(t*4); ctx.fillStyle="rgba(120,255,120,"+(0.1+0.15*pulse)+")"; ctx.beginPath(); ctx.arc(ax,ay,nR+40+pulse*10,0,7); ctx.fill(); }
    // 3D nucleus: nucleons on a fibonacci sphere, rotated, painter-sorted, shaded by depth
    const N=Math.min(protons+neutrons, 80);
    const rotY=t*0.35, rotX=0.35;
    const nucleons=[];
    for(let i=0;i<N;i++){
      const isP = i<Math.round(N*protons/(protons+neutrons));
      // fibonacci sphere point
      const phi=Math.acos(1-2*(i+0.5)/N), th=Math.PI*(1+Math.sqrt(5))*i;
      // fill the volume, not just the surface: radius by cube-root distribution
      const rr = nR*0.9*Math.cbrt((i%7+1)/7);
      let x3=rr*Math.sin(phi)*Math.cos(th), y3=rr*Math.sin(phi)*Math.sin(th), z3=rr*Math.cos(phi);
      // jiggle
      x3+=Math.cos(i*3+t*5)*1.5; y3+=Math.sin(i*2.4+t*4.6)*1.5; z3+=Math.sin(i*1.7+t*5.3)*1.5;
      // rotate Y then X
      let X=x3*Math.cos(rotY)+z3*Math.sin(rotY), Z=-x3*Math.sin(rotY)+z3*Math.cos(rotY), Y=y3;
      const Y2=Y*Math.cos(rotX)-Z*Math.sin(rotX), Z2=Y*Math.sin(rotX)+Z*Math.cos(rotX);
      nucleons.push({x:X, y:Y2, z:Z2, isP});
    }
    nucleons.sort((a,b)=>a.z-b.z);   // far first
    for(const n of nucleons){
      const depth=(n.z/nR+1)/2;    // 0 far, 1 near
      const sz=3.4+depth*3.2;
      const shade=0.45+depth*0.55;
      const px=ax+n.x, py=ay+n.y;
      const g=ctx.createRadialGradient(px-sz*0.35,py-sz*0.35,sz*0.15,px,py,sz);
      if(n.isP){ g.addColorStop(0,"rgba("+Math.floor(255*shade)+","+Math.floor(150*shade)+","+Math.floor(130*shade)+",1)"); g.addColorStop(1,"rgba("+Math.floor(160*shade)+","+Math.floor(35*shade)+","+Math.floor(25*shade)+",1)"); }
      else { g.addColorStop(0,"rgba("+Math.floor(240*shade)+","+Math.floor(245*shade)+","+Math.floor(252*shade)+",1)"); g.addColorStop(1,"rgba("+Math.floor(105*shade)+","+Math.floor(112*shade)+","+Math.floor(125*shade)+",1)"); }
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,sz,0,7); ctx.fill();
    }
    // 3D electron shells: each shell is a 3D ring at its own tilt; electrons get depth scale + occlusion
    const electrons=[];
    for(let s=0;s<cfg.length;s++){
      const sr=nR+40 + s*(maxR-nR-40)/(cfg.length||1);
      const tiltA=(s%2?-1:1)*(0.4+s*0.22);           // ring plane tilt around X
      const tiltB=s*0.7;                              // ring plane spin around Z for variety
      const col=["#7fd4ff","#a5f0c8","#ffd6f0","#ffe08a","#c8b5e8","#ff9fbb","#8fb8d4"][s%7];
      // orbit ring: sample the 3D circle and draw it as a path with per-segment alpha by depth
      let prev=null;
      for(let a=0;a<=Math.PI*2+0.01;a+=0.12){
        let x3=sr*Math.cos(a), y3=sr*Math.sin(a), z3=0;
        // tilt around X then Z
        let Y=y3*Math.cos(tiltA), Z=y3*Math.sin(tiltA);
        let X=x3*Math.cos(tiltB)-Y*Math.sin(tiltB); Y=x3*Math.sin(tiltB)+Y*Math.cos(tiltB);
        const depth=(Z/sr+1)/2;
        const px=ax+X, py=ay+Y;
        if(prev){ ctx.strokeStyle=hexA(col,0.10+depth*0.30); ctx.lineWidth=0.8+depth*0.7;
          ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(px,py); ctx.stroke(); }
        prev={x:px,y:py};
      }
      // electrons on the ring
      const nE=cfg[s]; const spinSpeed=(1.8-s*0.15);
      for(let k=0;k<nE;k++){
        const a=t*spinSpeed+k/nE*Math.PI*2;
        let x3=sr*Math.cos(a), y3=sr*Math.sin(a);
        let Y=y3*Math.cos(tiltA), Z=y3*Math.sin(tiltA);
        let X=x3*Math.cos(tiltB)-Y*Math.sin(tiltB); Y=x3*Math.sin(tiltB)+Y*Math.cos(tiltB);
        electrons.push({x:ax+X, y:ay+Y, z:Z, col, sr});
      }
    }
    electrons.sort((a,b)=>a.z-b.z);
    _eHits=[];
    for(const e of electrons){ _eHits.push({x:e.x,y:e.y,r:10});
      const depth=(e.z/e.sr+1)/2;
      const sz=2.5+depth*4.5, glow=5+depth*8;
      const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,glow);
      g.addColorStop(0,hexA(e.col,0.3+depth*0.6)); g.addColorStop(1,e.col+"00");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,glow,0,7); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,"+(0.35+depth*0.65)+")"; ctx.beginPath(); ctx.arc(e.x,e.y,sz*0.4,0,7); ctx.fill();
    }
    ctx.textAlign="left";
    _atomHit={cx:ax,cy:ay,r:nR};
  }
  let _atomHit=null, _eHits=[];

  // depth 1: nucleus zoomed way in, individual nucleons big and clickable
  function drawZoomedNucleus(z){
    const cell=tableCell(z); if(!cell) return;
    const ax=CX, ay=CY, protons=z, neutrons=Math.max(0,Math.round(cell.mass)-z);
    ctx.fillStyle=CAT_COL[elemCategory(z)]; ctx.font="bold 16px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText(cell.name.toUpperCase()+" NUCLEUS", ax, 40);
    ctx.fillStyle="rgba(220,240,255,0.7)"; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText(protons+" protons (red)  ·  "+neutrons+" neutrons (grey)  ·  click anything to explore", ax, 60);
    _nucHits=[];
    const N=Math.min(protons+neutrons, 80), R0=Math.min(H*0.35,240);
    for(let i=0;i<N;i++){
      const isP=i<Math.round(N*protons/(protons+neutrons));
      const a=(i*2.399); const rd=Math.sqrt(i/N)*R0;
      const nx=ax+Math.cos(a+t*0.5)*rd + Math.cos(a*3+t*2)*4;
      const ny=ay+Math.sin(a+t*0.5)*rd + Math.sin(a*3+t*2)*4;
      const g=ctx.createRadialGradient(nx-4,ny-4,1,nx,ny,16); g.addColorStop(0, isP?"#ff9080":"#e8ecf4"); g.addColorStop(1, isP?"#8a1a10":"#606870");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(nx,ny,14,0,7); ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,0.4)"; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle=isP?"rgba(255,255,255,0.85)":"rgba(20,20,20,0.65)";
      ctx.font="bold 10px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
      ctx.fillText(isP?"p":"n", nx, ny+3);
      _nucHits.push({x:nx,y:ny,r:14,isP,kind:isP?"proton":"neutron"});
    }
    // ---- extra particles: photons emitted around the nucleus, plus neutrinos (radioactive only) ----
    _partHits=[];
    const isRadio = cell.radio;
    // photons: gamma-ray flashes streaking outward
    for(let i=0;i<3;i++){
      const phase = (t*0.6 + i*2.1)%3;
      if(phase<1.5){
        const ang = i*2.09 + t*0.3;
        const dist = R0*0.5 + phase*R0*0.5;
        const px = ax+Math.cos(ang)*dist, py = ay+Math.sin(ang)*dist;
        // photon = squiggly wave line
        ctx.strokeStyle="rgba(255,240,120,"+(0.9-phase*0.5)+")"; ctx.lineWidth=2;
        ctx.beginPath();
        for(let k=0;k<12;k++){
          const kf=k/11;
          const wx=ax+Math.cos(ang)*(dist*(0.7+kf*0.3));
          const wy=ay+Math.sin(ang)*(dist*(0.7+kf*0.3)) + Math.sin(k*1.4)*3;
          k===0?ctx.moveTo(wx,wy):ctx.lineTo(wx,wy);
        }
        ctx.stroke();
        // photon dot at tip
        const g=ctx.createRadialGradient(px,py,0,px,py,10);
        g.addColorStop(0,"#fffdcf"); g.addColorStop(0.4,"#ffe960"); g.addColorStop(1,"rgba(255,220,60,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,10,0,7); ctx.fill();
        ctx.fillStyle="#4a3a10"; ctx.font="9px ui-monospace,Menlo,monospace"; ctx.fillText("γ", px, py+3);
        _partHits.push({x:px,y:py,r:12,kind:"photon"});
      }
    }
    // neutrinos: ghostly small dots streaking, only from radioactive nuclei
    if(isRadio){
      for(let i=0;i<4;i++){
        const phase=(t*0.9+i*1.5)%2;
        const ang=i*1.57+t*0.5;
        const dist=R0*0.4+phase*R0*0.6;
        const px=ax+Math.cos(ang)*dist, py=ay+Math.sin(ang)*dist;
        // trail
        ctx.strokeStyle="rgba(140,220,255,"+(0.35-phase*0.15)+")"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px-Math.cos(ang)*20, py-Math.sin(ang)*20); ctx.lineTo(px,py); ctx.stroke();
        // dot
        ctx.fillStyle="rgba(140,220,255,"+(0.7-phase*0.25)+")";
        ctx.beginPath(); ctx.arc(px,py,3,0,7); ctx.fill();
        ctx.fillStyle="rgba(220,240,255,0.8)"; ctx.font="9px ui-monospace,Menlo,monospace"; ctx.fillText("ν", px, py-8);
        _partHits.push({x:px,y:py,r:8,kind:"neutrino"});
      }
    }
    ctx.textAlign="left";
  }
  let _nucHits=[], _partHits=[];

  // depth 2: quarks (three quarks in a proton, held by gluons)
  let quarkMode="p";   // p = proton (uud), n = neutron (udd), e = electron (elementary)
  function drawQuarks(){
    const ax=CX, ay=CY;
    if(quarkMode==="e"){
      // electron: fundamental — nothing inside. Show it as a point with a quantum fuzz field.
      ctx.fillStyle="#7fd4ff"; ctx.font="bold 16px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
      ctx.fillText("ELECTRON  ·  fundamental particle", ax, 40);
      ctx.fillStyle="rgba(220,240,255,0.7)"; ctx.font="11px ui-monospace,Menlo,monospace";
      ctx.fillText("made of: nothing smaller. A true elementary lepton. charge -1", ax, 60);
      // fuzzy probability cloud
      for(let i=0;i<160;i++){ const a=(i*137.5)*Math.PI/180 + t*0.4; const r=8+((i*53+t*40)%140);
        const x=ax+Math.cos(a)*r, y=ay+Math.sin(a)*r*0.8;
        ctx.fillStyle="hsla("+(190+((i*7)%60))+",90%,70%,"+(0.5*Math.exp(-r/70))+")"; ctx.fillRect(x,y,2,2); }
      const g=ctx.createRadialGradient(ax,ay,0,ax,ay,30); g.addColorStop(0,"#eafcff"); g.addColorStop(0.3,"#7fd4ff"); g.addColorStop(1,"rgba(127,212,255,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ax,ay,30,0,7); ctx.fill();
      ctx.fillStyle="#04121f"; ctx.font="bold 20px ui-monospace,Menlo,monospace"; ctx.fillText("e⁻", ax, ay+7);
      ctx.fillStyle="rgba(180,220,255,0.6)"; ctx.font="11px ui-monospace,Menlo,monospace";
      ctx.fillText("point-like down to at least 10⁻²² m. It just IS.", ax, ay+120);
      ctx.textAlign="left"; return;
    }
    const isP = quarkMode==="p";
    ctx.fillStyle=isP?"#ff90a0":"#c8d4e8"; ctx.font="bold 16px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText((isP?"PROTON":"NEUTRON")+"  ·  three quarks", ax, 40);
    ctx.fillStyle="rgba(220,240,255,0.7)"; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText(isP?"2 up + 1 down, bound by gluons  ·  +2/3 +2/3 -1/3 = +1":"1 up + 2 down, bound by gluons  ·  +2/3 -1/3 -1/3 = 0", ax, 60);
    const quarks= isP
      ? [{n:"u",col:"#ff9060",ch:"+2/3"},{n:"u",col:"#ff9060",ch:"+2/3"},{n:"d",col:"#60a0ff",ch:"-1/3"}]
      : [{n:"u",col:"#ff9060",ch:"+2/3"},{n:"d",col:"#60a0ff",ch:"-1/3"},{n:"d",col:"#60a0ff",ch:"-1/3"}];
    const pts=quarks.map((q,i)=>{ const a=t*0.6+i*(Math.PI*2/3); const wob=1+Math.sin(t*2+i)*0.15; return {x:ax+Math.cos(a)*90*wob, y:ay+Math.sin(a)*90*wob, q}; });
    for(let i=0;i<3;i++){
      const a=pts[i], b=pts[(i+1)%3];
      ctx.strokeStyle="rgba(255,220,120,0.55)"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(a.x,a.y);
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, nx=-(b.y-a.y), ny=(b.x-a.x); const nn=Math.hypot(nx,ny); const wob=Math.sin(t*8+i)*10;
      ctx.quadraticCurveTo(mx+nx/nn*wob, my+ny/nn*wob, b.x,b.y); ctx.stroke();
    }
    for(const p of pts){
      const g=ctx.createRadialGradient(p.x-6,p.y-6,2,p.x,p.y,26); g.addColorStop(0,"#fff"); g.addColorStop(0.4,p.q.col); g.addColorStop(1,p.q.col+"00");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,26,0,7); ctx.fill();
      ctx.fillStyle="#0a0a0a"; ctx.font="bold 22px ui-monospace,Menlo,monospace"; ctx.textAlign="center"; ctx.fillText(p.q.n, p.x, p.y+8);
      ctx.fillStyle=p.q.col; ctx.font="10px ui-monospace,Menlo,monospace"; ctx.fillText(p.q.ch, p.x, p.y+28);
    }
    ctx.textAlign="left";
  }

  // depth 3: the answer, 42

  // ---- per-element 3D-ish scenes: carbon gets DNA/cell; the rest get a category scene ----
  function drawElementScene(z){
    const cell=tableCell(z); if(!cell){elemScene=0;return;}
    if(z===6){ // CARBON — the element of life: alternate cell and DNA slowly
      if(Math.floor(t/12)%2===0) drawCell(); else drawDNA();
      return;
    }
    // ---- special per-element scenes ----
    const cat=elemCategory(z), col=CAT_COL[cat]||"#8ff";
    ctx.fillStyle="#04050c"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=col; ctx.font="bold 18px ui-monospace,Menlo,monospace"; ctx.textAlign="center";
    ctx.fillText(cell.name.toUpperCase(), CX, 44);
    ctx.fillStyle="rgba(220,240,255,0.6)"; ctx.font="11px ui-monospace,Menlo,monospace";
    ctx.fillText(cat.toUpperCase()+" · "+elementSceneCaption(z), CX, 64);

    // dispatch to a specific renderer if we have one
    if(z===1) return drawSceneHydrogen(cell);
    if(z===2) return drawSceneHelium(cell);
    if(z===8) return drawSceneOxygen(cell);
    if(z===13) return drawSceneAluminium(cell);
    if(z===14) return drawSceneSilicon(cell);
    if(z===26) return drawSceneIron(cell);
    if(z===29) return drawSceneCopper(cell);

    if(z===79) return drawSceneGold(cell);
    if(z===80) return drawSceneMercury(cell);
    if(z===82) return drawSceneLead(cell);
    if(z===92) return drawSceneUranium(cell);
    if(z===94) return drawScenePlutonium(cell);
    // otherwise the category default
    drawSceneCategory(z, cell, cat, col);

  // ---- individual element scenes ----
  function drawSceneHydrogen(cell){
    // fusion reaction: pairs of H protons colliding into He + energy burst
    for(let i=0;i<12;i++){
      const phase=(t*0.6+i*0.5)%(Math.PI*2);
      const dist=90*(1-Math.abs(Math.cos(phase)));
      const ang=i*0.55;
      const x1=CX+Math.cos(ang)*dist, y1=CY+Math.sin(ang)*dist;
      const x2=CX-Math.cos(ang)*dist, y2=CY-Math.sin(ang)*dist;
      ctx.fillStyle="#ff8060"; ctx.beginPath(); ctx.arc(x1,y1,5,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(x2,y2,5,0,7); ctx.fill();
      if(dist<8){ const g=ctx.createRadialGradient(CX,CY,2,CX,CY,80); g.addColorStop(0,"#fff"); g.addColorStop(0.4,"#ffee80"); g.addColorStop(1,"rgba(255,150,60,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,80,0,7); ctx.fill(); }
    }
    ctx.fillStyle="#ff8060"; ctx.font="bold 32px ui-monospace,Menlo,monospace"; ctx.textAlign="center"; ctx.fillText("H", CX, H-70);
    ctx.fillStyle="rgba(200,220,255,0.55)"; ctx.font="11px ui-monospace,Menlo,monospace"; ctx.fillText("fusing in the heart of every star", CX, H-45);
    ctx.textAlign="left";
  }
  function drawSceneHelium(cell){

    for(let i=0;i<8;i++){

      const y=H+40 - rise;
      const x=CX + Math.sin(rise*0.02+i)*40 + (i-4)*40;

      g.addColorStop(0,"hsla("+hue+",90%,80%,0.9)");

  function drawSceneUranium(cell){
    // chain reaction: neutrons bouncing off nuclei splitting them
    const pulse=0.5+0.5*Math.sin(t*3);
    for(let ring=6;ring>0;ring--){ ctx.strokeStyle="rgba(120,255,140,"+(0.06*ring*pulse)+")"; ctx.lineWidth=12;
      ctx.beginPath(); ctx.arc(CX,CY,50+ring*32+pulse*10,0,7); ctx.stroke(); }
    // multiple nuclei fissioning
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3+t*0.3, d=80;
      const nx=CX+Math.cos(a)*d, ny=CY+Math.sin(a)*d;
      const stage=(t*1.5+i*0.6)%3;
      if(stage<1){
        ctx.fillStyle="#7cff7c"; ctx.beginPath(); ctx.arc(nx,ny,14,0,7); ctx.fill();
      } else {
        // split into two
        const split=(stage-1)*20;
        ctx.fillStyle="#7cff7c";
        ctx.beginPath(); ctx.arc(nx-split,ny,10,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(nx+split,ny,10,0,7); ctx.fill();
        // released neutrons
        for(let n=0;n<3;n++){
          const na=n*2.1+i, nd=split*3;
          ctx.fillStyle="#c0c0c0";
          ctx.beginPath(); ctx.arc(nx+Math.cos(na)*nd, ny+Math.sin(na)*nd, 3, 0, 7); ctx.fill();
        }
      }

  // ================================================================
  // 3D BODY VIEWER — WebGL fragment-shader per-body renderer (cool af)
  // ================================================================
  const v3Overlay=document.getElementById("view3dOverlay");
  let v3Canvas=document.getElementById("view3dCanvas");
  let v3CanvasKind=null;   // "webgl" or "2d" — swapped once per open, never per frame

  let v3Obj=null, v3Rot={x:0.2,y:0}, v3Zoom=1, v3Dragging=false, v3lx=0,v3ly=0, v3Animating=false, v3RafId=null;

  // Fragment shader — one big shader that switches per body via a uMode uniform.
  // Runs on the GPU, per pixel, in parallel. Genuinely 60fps.
  const V3_VS = "attribute vec2 a_pos; varying vec2 v_uv; void main(){ v_uv = a_pos; gl_Position = vec4(a_pos, 0.0, 1.0); }";

  const V3_FS = `
precision highp float;
varying vec2 v_uv;
uniform float uTime;
uniform float uRotX;
uniform float uRotY;
uniform float uZoom;
uniform int uMode;      // 0 sun 1 moon 2 mercury 3 venus 4 mars 5 jupiter 6 saturn 7 uranus 8 neptune
uniform float uAspect;

// ---- 3D noise (no UV seams, no equator butt-joints) ----
float hash3(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453); }
float noise3(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),u.x),
                 mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),u.x),u.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),u.x),
                 mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),u.x),u.y),u.z); }
float fbm3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=noise3(p)*a; p*=2.03; a*=0.5; } return s; }
float ridged3(vec3 p){ return 1.0-abs(fbm3(p)*2.0-1.0); }
float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

vec3 rotToBody(vec3 v){
  float cx=cos(uRotX), sx=sin(uRotX);
  float cy=cos(uRotY), sy=sin(uRotY);
  vec3 r=vec3(v.x*cy+v.z*sy, v.y, -v.x*sy+v.z*cy);
  return vec3(r.x, r.y*cx-r.z*sx, r.y*sx+r.z*cx);
}
vec3 rotToView(vec3 v){
  float cx=cos(-uRotX), sx=sin(-uRotX);
  float cy=cos(-uRotY), sy=sin(-uRotY);
  vec3 r=vec3(v.x, v.y*cx-v.z*sx, v.y*sx+v.z*cx);
  return vec3(r.x*cy+r.z*sy, r.y, -r.x*sy+r.z*cy);
}

// per-body surface colour from 3D body-space point p (unit sphere)
vec3 bodyColor(vec3 p){
  float lat=p.y;
  if(uMode==0){ // sun — roiling plasma with a smiling comic face on the near side
    float n=fbm3(p*3.5+vec3(uTime*0.08)); float g=fbm3(p*9.0-vec3(uTime*0.15)); float r=ridged3(p*3.0+vec3(uTime*0.04));
    float hot=n*0.6+r*0.5+g*0.3;
    vec3 col=mix(vec3(1.0,0.3,0.0), vec3(1.0,0.85,0.3), hot);
    col=mix(col, vec3(1.0,1.0,0.85), pow(hot,4.0));
    col*=(1.0-smoothstep(0.72,0.85,fbm3(p*6.0))*0.6);
    // COMIC FACE — only on the near hemisphere (p.z > 0.6)
    if(p.z > 0.5){
      vec3 eyeL=normalize(vec3(-0.20,0.22,0.95));
      vec3 eyeR=normalize(vec3(0.20,0.22,0.95));
      float eyes = smoothstep(0.055,0.035,length(p-eyeL)) + smoothstep(0.055,0.035,length(p-eyeR));
      // rosy cheeks
      vec3 chkL=normalize(vec3(-0.35,-0.05,0.93));
      vec3 chkR=normalize(vec3(0.35,-0.05,0.93));
      float cheeks = smoothstep(0.09,0.05,length(p-chkL)) + smoothstep(0.09,0.05,length(p-chkR));
      // big grin
      float sx=p.x, sy=p.y;
      float grin_curve = -0.10*cos(sx*4.0) - 0.15;
      float grin_band = smoothstep(0.045,0.020, abs(sy - grin_curve));
      float grin = grin_band * step(-0.28, sx) * step(sx, 0.28);
      // apply
      col = mix(col, vec3(0.15,0.08,0.05), eyes*0.85);
      col = mix(col, vec3(1.0,0.5,0.5), cheeks*0.35);
      col = mix(col, vec3(0.2,0.05,0.0), grin*0.85);
    }
    return col;
  }
  if(uMode==1){ // moon — cratered PLUS cheese-man face on the near side
    float base=0.72+fbm3(p*3.0)*0.15;                                  // brighter/yellower base for cheese
    base-=smoothstep(0.55,0.35,fbm3(p*1.6+3.0))*0.12;
    base-=smoothstep(0.5,0.72,ridged3(p*18.0))*0.10;
    base-=smoothstep(0.55,0.75,ridged3(p*42.0))*0.08;
    // CHEESE HOLES (a few big circular pits on the near side)
    vec3 hole1=normalize(vec3(-0.25,0.30,0.92));
    vec3 hole2=normalize(vec3(0.28,0.15,0.94));
    vec3 hole3=normalize(vec3(-0.05,-0.20,0.98));
    vec3 hole4=normalize(vec3(0.35,-0.35,0.87));
    vec3 hole5=normalize(vec3(-0.40,-0.10,0.91));
    float h=smoothstep(0.10,0.03,length(p-hole1))
          + smoothstep(0.08,0.02,length(p-hole2))
          + smoothstep(0.09,0.03,length(p-hole3))
          + smoothstep(0.07,0.02,length(p-hole4))
          + smoothstep(0.08,0.02,length(p-hole5));
    base -= h*0.35;
    // FACE features (very subtle, cartoony) — only on facing hemisphere
    vec3 eyeL=normalize(vec3(-0.18,0.20,0.96));
    vec3 eyeR=normalize(vec3(0.18,0.20,0.96));
    float eyes = smoothstep(0.045,0.03,length(p-eyeL)) + smoothstep(0.045,0.03,length(p-eyeR));
    base -= eyes*0.5;
    // smile: sample a curve y = -0.06*cos(x*3.0) - 0.08 in tangent plane
    float sx = p.x, sy = p.y;
    float smile_curve = -0.06*cos(sx*4.5) - 0.14;
    float smile = smoothstep(0.028, 0.012, abs(sy - smile_curve)) * step(-0.22, sx) * step(sx, 0.22) * step(p.z, 1.0) * step(0.7, p.z);
    base -= smile*0.45;
    // cheese yellow tint
    return vec3(base*1.0, base*0.94, base*0.65);
  }
  if(uMode==2){ float b=0.36+fbm3(p*4.0)*0.28; b-=smoothstep(0.5,0.72,ridged3(p*22.0))*0.14; return vec3(b*1.05,b*0.97,b*0.88); }
  if(uMode==3){ float c=fbm3(p*2.5+vec3(uTime*0.03,0.0,0.0)); float s2=fbm3(p*6.0+vec3(uTime*0.05))*0.4; float b=0.7+c*0.28+s2*0.1; return vec3(b,b*0.86,b*0.55); }
  if(uMode==4){ float b=0.5+fbm3(p*3.5)*0.33; b-=smoothstep(0.6,0.4,fbm3(p*1.8))*0.14;
    vec3 col=vec3(b*1.1,b*0.5,b*0.36);

          const b=[verts[1][0]+(verts[2][0]-verts[1][0])*t2, verts[1][1]+(verts[2][1]-verts[1][1])*t2];
          ctx2.strokeStyle="rgba(50,110,180,0.4)"; ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.lineTo(b[0],b[1]); ctx2.stroke();
        }
        // sun-glint highlight
        const glint=0.4+0.6*Math.sin(t*0.5+side);
        ctx2.strokeStyle="rgba(180,220,255,"+(0.2*glint)+")"; ctx2.lineWidth=2;
        ctx2.beginPath(); ctx2.moveTo(verts[0][0],verts[0][1]); ctx2.lineTo(verts[2][0],verts[2][1]); ctx2.stroke();
      }
    }

    // ---- radiators (white thermal panels perpendicular to sun) ----
    for(const side of [-1,1]){
      for(const yOff of [-50*s, 50*s]){
        const rx0 = side*trussLen*0.28;
        const px=[rx0-40*s, rx0+40*s, rx0+40*s, rx0-40*s];
        const py=[yOff, yOff, yOff, yOff];
        const pz=[-90*s, -90*s, 90*s, 90*s];
        const verts=px.map((x,i)=>proj([x,py[i],pz[i]]));
        ctx2.beginPath(); ctx2.moveTo(verts[0][0],verts[0][1]);
        for(let i=1;i<4;i++) ctx2.lineTo(verts[i][0],verts[i][1]);
        ctx2.closePath();
        ctx2.fillStyle="rgba(215,222,235,0.92)"; ctx2.fill();
        ctx2.strokeStyle="rgba(120,140,180,0.7)"; ctx2.lineWidth=1; ctx2.stroke();
        // radiator ribs
        for(let k=1;k<10;k++){ const t2=k/10;
          const a=[verts[0][0]+(verts[3][0]-verts[0][0])*t2, verts[0][1]+(verts[3][1]-verts[0][1])*t2];
          const b=[verts[1][0]+(verts[2][0]-verts[1][0])*t2, verts[1][1]+(verts[2][1]-verts[1][1])*t2];
          ctx2.strokeStyle="rgba(100,120,160,0.5)"; ctx2.beginPath(); ctx2.moveTo(a[0],a[1]); ctx2.lineTo(b[0],b[1]); ctx2.stroke();
        }
      }
    }

    // ---- communications dish (parabolic on a mast) ----
    const dishMast = proj([0,-150*s,20*s]);
    const dishBase = proj([0,-120*s,20*s]);
    ctx2.strokeStyle="rgba(150,165,190,0.9)"; ctx2.lineWidth=2;
    ctx2.beginPath(); ctx2.moveTo(dishBase[0],dishBase[1]); ctx2.lineTo(dishMast[0],dishMast[1]); ctx2.stroke();
    ctx2.fillStyle="rgba(220,225,235,0.95)";
    ctx2.beginPath(); ctx2.ellipse(dishMast[0],dishMast[1], 22*s, 8*s, 0, 0, Math.PI*2); ctx2.fill();
    ctx2.strokeStyle="rgba(100,115,145,0.8)"; ctx2.stroke();
    // dish shadow curve
    ctx2.strokeStyle="rgba(140,150,175,0.6)"; ctx2.lineWidth=1.4;
    ctx2.beginPath(); ctx2.ellipse(dishMast[0],dishMast[1], 22*s, 8*s, 0, Math.PI*0.15, Math.PI-0.15); ctx2.stroke();

    // ---- external attached spacecraft (Soyuz-ish) ----
    const sy = 130*s;
    drawCyl(0,sy,45*s, 'y', 10*s, 34*s, hullCol);
    // solar wings on spacecraft
    for(const side of [-1,1]){
      const spx=[side*12*s, side*70*s, side*70*s, side*12*s];
      const spy=[sy-14*s, sy-14*s, sy+14*s, sy+14*s];
      const verts=spx.map((x,i)=>proj([x,spy[i],45*s]));
      ctx2.beginPath(); ctx2.moveTo(verts[0][0],verts[0][1]);
      for(let i=1;i<4;i++)ctx2.lineTo(verts[i][0],verts[i][1]);
      ctx2.closePath();
      ctx2.fillStyle="rgba(35,50,80,0.9)"; ctx2.fill();
      ctx2.strokeStyle="rgba(120,160,220,0.6)"; ctx2.lineWidth=0.8; ctx2.stroke();
    }

    // ---- CYBERPUNK DETAIL ----
    // beacon lights
    for(let i=0;i<9;i++){
      const yy = -trussLen/2 + (i/8)*trussLen;
      const p = proj([yy, 0, 12*s]);
      const blink = Math.sin(t*5+i*1.7)>0.4;
      if(blink){
        const col = i%2 ? "#ff4d6a" : "#4dffb0";
        ctx2.fillStyle=col; ctx2.shadowColor=col; ctx2.shadowBlur=8;
        ctx2.beginPath(); ctx2.arc(p[0],p[1], 2*s, 0, 7); ctx2.fill();
        ctx2.shadowBlur=0;
      }
    }
    // neon accent on the truss
    ctx2.strokeStyle=neon; ctx2.shadowColor=neon; ctx2.shadowBlur=10; ctx2.lineWidth=1.4;
    const a1=proj([-trussLen/2, -11*s, 11*s]), a2=proj([trussLen/2, -11*s, 11*s]);
    ctx2.beginPath(); ctx2.moveTo(a1[0],a1[1]); ctx2.lineTo(a2[0],a2[1]); ctx2.stroke();
    ctx2.shadowBlur=0;

    ctx2.fillStyle=neon; ctx2.shadowColor=neon; ctx2.shadowBlur=14;
    ctx2.font="bold 14px ui-monospace,Menlo,monospace"; ctx2.textAlign="center";
    ctx2.fillText(isISS?"I S S":"C S S", 0, 175*s);
    ctx2.shadowBlur=0; ctx2.textAlign="left";
    ctx2.restore();
  }

  function _speakEdge(item, done){
    const text = speakClean(item.text);
    if(!text || !text.trim()){ done(); return; }
    const voice = item.mode==="alien" ? TTS_VOICE_ALIEN : TTS_VOICE_MAIN;
    const url = TTS_ENDPOINT + "?text=" + encodeURIComponent(text) + "&voice=" + voice;
    // fetch as MP3 blob, then play via <audio>
    fetch(url).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.blob(); })
      .then(blob=>{
        const audio = new Audio(URL.createObjectURL(blob));
        _currentAudio = audio;
        if(item.mode==="alien"){ audio.playbackRate = 0.75; }
        audio.onended = done;

        audio.play().catch(()=>{ done(); });
      })
      .catch(err=>{
        console.warn("Edge TTS failed, falling back:", err);

        _speakBrowser(item, done);

  // map DeviceOrientation → view.heading (azimuth) + view.altitude
  function arOrientationHandler(e){
    // only drive the view in the normal sky (not while in map/subatomic/cosmic layers)
    if(subatomic || cosmicLevel!==0) return;
    // compass heading: iOS gives webkitCompassHeading (true, clockwise from N).
    // Android: use alpha but it's counter-clockwise, and screen orientation matters.
    let heading;
    if(typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)){
      heading = e.webkitCompassHeading;                 // already 0=N, clockwise
    } else if(e.alpha !== null){
      heading = 360 - e.alpha;                           // convert CCW→CW
    } else return;

    // account for screen rotation
    const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    heading = (heading + so + 360) % 360;

    // altitude from beta (front-back tilt). Holding phone upright & pointing at horizon: beta≈90.
    // Pointing straight up at zenith: beta≈0 (screen facing up) — but people hold it up like a window.
    // Best feel: altitude = beta - 90, so upright(90)→0° horizon, tilt back(180)→+90 up.
    let beta = e.beta;    // -180..180, front-back

    let altitude = beta - 90;

  // arpeggio loop — plays a note every 3-6 seconds, picking from current chord

    function swap(){
      if(!musicOn){ chordSwapper=null; return; }
      chordIdx = (chordIdx+1) % CHORD_CYCLE.length;
      startPad(CHORD_CYCLE[chordIdx]);
      chordSwapper = setTimeout(swap, 18000+Math.random()*8000);
    }
    chordSwapper = setTimeout(swap, 20000);
  }
  function stopChordSwapper(){ if(chordSwapper){ clearTimeout(chordSwapper); chordSwapper=null; } }

  function musicStart(){
    if(!musicInit()) return false;
    if(ac.state === "suspended"){ ac.resume(); }
    musicOn = true;
    startPad(CHORD_CYCLE[chordIdx]);
    startArp();
    startChordSwapper();
    return true;
  }
  function musicStop(){
    musicOn=false;
    stopPad(); stopArp(); stopChordSwapper();
  }
  // music auto-starts on the first user interaction (browser requires a gesture before audio)
  function _musicKick(){ if(!musicOn){ musicStart(); } window.removeEventListener("pointerdown",_musicKick); window.removeEventListener("wheel",_musicKick); window.removeEventListener("touchstart",_musicKick); }

  window.addEventListener("wheel",_musicKick,{passive:true});
  window.addEventListener("touchstart",_musicKick,{passive:true});

  // ---- Location picker: a proper rotatable 3D globe (orthographic, self-contained/offline) ----
  const mapOverlay=document.getElementById("mapOverlay"), mapCanvas=document.getElementById("mapCanvas"), mctx=mapCanvas.getContext("2d");
  const mapLoc=document.getElementById("mapLoc");
  const GS=720; mapCanvas.width=GS; mapCanvas.height=GS;   // big square globe for the fullscreen picker
  const GR0=GS/2-30, GCX=GS/2, GCY=GS/2;
  let globeZoom=1;                          // 1 = whole globe, up to ~4 = city level
  function GRz(){ return GR0*globeZoom; }
  let pickLat=LAT, pickLon=LON, pickName=PLACE_NAME;
  let globeLon=-(LON), globeLat=-(LAT);   // centre the globe on home location (full sphere visible)
  const LM_RAW=[
    // North America (better outline)
    [[-168,66],[-158,71],[-140,70],[-124,71],[-95,73],[-83,74],[-73,79],[-60,82],[-55,73],[-52,60],[-63,47],[-70,42],[-75,36],[-81,25],[-97,26],[-97,18],[-105,16],[-117,32],[-124,41],[-134,55],[-152,60],[-168,66]],
    // Central America
    [[-97,18],[-92,15],[-88,17],[-83,10],[-77,8],[-79,15],[-88,20],[-97,18]],
    // South America
    [[-81,12],[-72,12],[-62,10],[-52,4],[-42,-3],[-35,-8],[-38,-14],[-40,-23],[-49,-33],[-56,-38],[-63,-40],[-67,-45],[-72,-52],[-74,-45],[-73,-33],[-71,-20],[-77,-8],[-79,-5],[-81,4],[-81,12]],
    // Europe
    [[-10,36],[-10,44],[-5,48],[2,51],[9,54],[15,55],[24,60],[30,66],[38,66],[45,60],[41,50],[38,44],[30,42],[24,42],[19,40],[12,38],[6,36],[-10,36]],
    // Britain & Ireland (rough)
    [[-6,50],[-2,52],[-3,55],[-5,58],[-4,53],[-6,50]],
    [[-10,54],[-6,55],[-6,52],[-10,52],[-10,54]],
    // Scandinavia (already covered above, extend slightly)
    [[5,58],[10,60],[16,64],[22,68],[27,70],[24,68],[19,63],[12,60],[8,58],[5,58]],
    // Africa
    [[-17,20],[-16,28],[-8,32],[10,35],[24,32],[35,32],[43,12],[52,10],[52,4],[45,-4],[40,-15],[32,-25],[20,-34],[18,-34],[14,-25],[10,-8],[8,4],[-8,4],[-15,10],[-17,20]],
    // Madagascar
    [[43,-13],[46,-13],[50,-16],[50,-25],[46,-25],[43,-20],[43,-13]],
    // Middle East / Arabia
    [[35,32],[42,25],[52,20],[54,17],[57,22],[52,25],[45,29],[38,29],[35,32]],
    // Asia (big block)
    [[45,60],[60,68],[80,72],[100,75],[140,72],[168,66],[178,68],[170,60],[155,55],[140,50],[135,42],[122,40],[125,32],[122,22],[112,20],[102,22],[95,15],[80,8],[72,20],[62,25],[55,28],[45,42],[45,60]],
    // India (peninsula shape)
    [[68,23],[78,32],[88,25],[91,22],[85,20],[80,8],[73,15],[70,20],[68,23]],
    // SE Asia peninsula
    [[97,20],[104,20],[108,12],[105,10],[100,7],[100,15],[97,20]],
    // Indonesia (very simplified arc)
    [[95,5],[105,-2],[115,-5],[125,-4],[135,-2],[125,-8],[115,-8],[105,-6],[100,-2],[95,5]],
    // Japan
    [[130,32],[136,35],[141,41],[145,44],[141,38],[137,34],[132,32],[130,32]],
    // Philippines
    [[120,7],[125,10],[126,14],[122,18],[120,14],[119,10],[120,7]],
    // Australia
    [[113,-22],[113,-32],[118,-35],[128,-32],[137,-35],[145,-38],[150,-37],[153,-28],[145,-16],[137,-12],[128,-14],[122,-16],[113,-22]],
    // Tasmania
    [[144,-40],[148,-40],[148,-43],[145,-43],[144,-40]],
    // NEW ZEALAND North Island (Auckland sits at ~-36.85, 174.76, on the isthmus)
    [[172.8,-34.4],[173.5,-34.6],[174.5,-35.2],[175.3,-36],[175.9,-36.8],[176.5,-37.5],[177.5,-37.8],[178.5,-37.7],[178.3,-38.6],[177.5,-39.4],[176.5,-40],[175.5,-40.5],[174.9,-41.3],[174.2,-41.5],[173.5,-40.8],[173.2,-40],[173.5,-39],[173.8,-38],[173.3,-36.8],[172.8,-35.5],[172.8,-34.4]],
    // NEW ZEALAND South Island
    [[173.8,-40.7],[174.3,-41.7],[174.2,-42.5],[173.5,-43.2],[172.8,-43.9],[171.3,-44.5],[170,-45.3],[169,-46.2],[167,-46.7],[166.5,-46],[167.5,-44.5],[169,-43.5],[170.5,-42.5],[172,-41.5],[173.8,-40.7]],
    // Iceland
    [[-24,63.5],[-18,64],[-14,65],[-14,66.5],[-19,66.5],[-24,66],[-24,63.5]],
    // Greenland (basic)
    [[-45,60],[-32,60],[-22,68],[-25,78],[-40,82],[-55,80],[-55,72],[-50,66],[-45,60]],
  ];
  // Chaikin corner-cutting: rounds the jagged coastlines into smooth curves
  function chaikin(poly,iters){ let p=poly; for(let k=0;k<iters;k++){ const out=[p[0]];
    for(let i=0;i<p.length-1;i++){ const a=p[i],b=p[i+1];
      out.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
      out.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]); }
    out.push(p[p.length-1]); p=out; } return p; }
  function densify(poly,step){ const out=[]; for(let i=0;i<poly.length-1;i++){ const a=poly[i],b=poly[i+1]; const segs=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step)); for(let s=0;s<segs;s++){ const t=s/segs; out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); } } out.push(poly[poly.length-1]); return out; }
  const LANDMASSES=LM_RAW.map(m=>densify(chaikin(m,2),2));
  const CITIES=[
    ["Auckland",-36.85,174.76],["Wellington",-41.29,174.78],["Christchurch",-43.53,172.63],
    ["Sydney",-33.87,151.21],["London",51.51,-0.13],["New York",40.71,-74.0],
    ["Tokyo",35.68,139.65],["Cape Town",-33.92,18.42],["Rio",-22.91,-43.17],["Reykjavik",64.15,-21.94],
    ["Dubai",25.2,55.27],["Singapore",1.35,103.82],["Honolulu",21.31,-157.86],["Ushuaia",-54.8,-68.3]
  ];
  // rotate a lon/lat to camera space; returns {x,y,front} (front=true if on the near hemisphere)
  function globePoint(lon,lat){
    const la=lat*Math.PI/180, lo=(lon+globeLon)*Math.PI/180, tilt=globeLat*Math.PI/180, GR=GRz();
    let x=Math.cos(la)*Math.sin(lo), y=Math.sin(la), z=Math.cos(la)*Math.cos(lo);
    const y2=y*Math.cos(tilt)-z*Math.sin(tilt), z2=y*Math.sin(tilt)+z*Math.cos(tilt);
    return { x:GCX+x*GR, y:GCY-y2*GR, front: z2>=0 };
  }
  function globeUnproject(sx,sy){
    const GR=GRz(); const nx=(sx-GCX)/GR, ny=-(sy-GCY)/GR; const r2=nx*nx+ny*ny; if(r2>1) return null;
    const nz=Math.sqrt(1-r2); const tilt=-globeLat*Math.PI/180;
    const y=ny*Math.cos(tilt)-nz*Math.sin(tilt), z=ny*Math.sin(tilt)+nz*Math.cos(tilt), x=nx;
    const lat=Math.asin(Math.max(-1,Math.min(1,y)))*180/Math.PI;
    let lon=Math.atan2(x,z)*180/Math.PI - globeLon;
    lon=((lon+540)%360)-180;
    return { lat, lon };
  }
  function drawMap(){
    const GR=GRz();
    mctx.clearRect(0,0,GS,GS);
    mctx.fillStyle="#05070f"; mctx.fillRect(0,0,GS,GS);
    mctx.fillStyle="rgba(180,200,235,0.5)"; for(let i=0;i<50;i++){ const a=(i*97)%GS, b=(i*53)%GS; mctx.fillRect(a,b,1,1); }
    // ocean sphere
    const og=mctx.createRadialGradient(GCX-GR*0.3,GCY-GR*0.3,GR*0.2,GCX,GCY,GR);
    og.addColorStop(0,"#1a4a7a"); og.addColorStop(0.7,"#0d2f52"); og.addColorStop(1,"#071a30");
    mctx.beginPath(); mctx.arc(GCX,GCY,GR,0,Math.PI*2); mctx.fillStyle=og; mctx.fill();
    mctx.strokeStyle="rgba(110,179,255,0.5)"; mctx.lineWidth=2; mctx.beginPath(); mctx.arc(GCX,GCY,GR,0,Math.PI*2); mctx.stroke();
    mctx.save(); mctx.beginPath(); mctx.arc(GCX,GCY,GR,0,Math.PI*2); mctx.clip();
    // graticule
    mctx.strokeStyle="rgba(120,170,235,0.14)"; mctx.lineWidth=1;
    for(let lon=-180;lon<180;lon+=30){ let started=false; mctx.beginPath(); for(let lat=-90;lat<=90;lat+=4){ const p=globePoint(lon,lat); if(p.front){ if(!started){mctx.moveTo(p.x,p.y);started=true;} else mctx.lineTo(p.x,p.y);} else started=false; } mctx.stroke(); }
    for(let lat=-60;lat<=60;lat+=30){ let started=false; mctx.beginPath(); for(let lon=-180;lon<=180;lon+=4){ const p=globePoint(lon,lat); if(p.front){ if(!started){mctx.moveTo(p.x,p.y);started=true;} else mctx.lineTo(p.x,p.y);} else started=false; } mctx.stroke(); }
    // land (densified, smooth)
    for(const m of LANDMASSES){ let any=false; mctx.beginPath(); let started=false;
      for(let i=0;i<m.length;i++){ const p=globePoint(m[i][0],m[i][1]); if(p.front){ any=true; if(!started){mctx.moveTo(p.x,p.y);started=true;} else mctx.lineTo(p.x,p.y);} else started=false; }
      if(any){ const lg=mctx.createRadialGradient(GCX-GR*0.3,GCY-GR*0.3,GR*0.2,GCX,GCY,GR); lg.addColorStop(0,"#2f9e6a"); lg.addColorStop(1,"#155a3a"); mctx.fillStyle=lg; mctx.fill(); mctx.strokeStyle="rgba(120,230,175,0.3)"; mctx.lineWidth=1; mctx.stroke(); } }
    // cities (front only)
    for(const c of CITIES){ const p=globePoint(c[2],c[1]); if(p.front){
      const isAkl = c[0]==="Auckland";
      mctx.fillStyle=isAkl?"#ffd24a":"rgba(220,230,250,0.85)";
      mctx.beginPath(); mctx.arc(p.x,p.y, isAkl?4:2.6, 0, 7); mctx.fill();
      if(isAkl){ mctx.strokeStyle="rgba(255,210,74,0.5)"; mctx.lineWidth=1; mctx.beginPath(); mctx.arc(p.x,p.y,8,0,7); mctx.stroke(); }
      mctx.fillStyle=isAkl?"#ffe6a0":"rgba(220,230,250,0.75)";
      mctx.font=(isAkl?"bold 12px ":"11px ")+"ui-monospace,Menlo,monospace";
      mctx.fillText(c[0], p.x+6, p.y-4);
    } }
    // chosen marker (front only)
    const pm=globePoint(pickLon,pickLat);
    if(pm.front){ mctx.strokeStyle="#ffd24a"; mctx.lineWidth=2; mctx.beginPath(); mctx.arc(pm.x,pm.y,7,0,Math.PI*2); mctx.stroke();
      mctx.fillStyle="#ffd24a"; mctx.beginPath(); mctx.arc(pm.x,pm.y,3,0,Math.PI*2); mctx.fill();
      mctx.beginPath(); mctx.moveTo(pm.x,pm.y-11); mctx.lineTo(pm.x,pm.y-19); mctx.moveTo(pm.x-11,pm.y); mctx.lineTo(pm.x-19,pm.y); mctx.stroke(); }
    mctx.restore();
    // terminator shadow (day/night gradient over the sphere for depth)
    const term=mctx.createRadialGradient(GCX-GR*0.35,GCY-GR*0.35,GR*0.1,GCX,GCY,GR*1.15);
    term.addColorStop(0,"rgba(0,0,0,0)"); term.addColorStop(0.75,"rgba(0,0,0,0)"); term.addColorStop(1,"rgba(0,0,0,0.45)");
    mctx.save(); mctx.beginPath(); mctx.arc(GCX,GCY,GR,0,Math.PI*2); mctx.clip(); mctx.fillStyle=term; mctx.fillRect(0,0,GS,GS); mctx.restore();
  }
  function nearestCity(lat,lon){ let best=null,bd=Infinity; for(const c of CITIES){ const d=(c[1]-lat)**2+((c[2]-lon)*Math.cos(lat*Math.PI/180))**2; if(d<bd){bd=d;best=c;} } return (bd<40)?best[0]:null; }
  function setPick(lat,lon){ pickLat=Math.max(-85,Math.min(85,lat)); pickLon=((lon+540)%360)-180; const cn=nearestCity(pickLat,pickLon); pickName=cn||(pickLat.toFixed(1)+"°, "+pickLon.toFixed(1)+"°");
    mapLoc.textContent=(cn?cn+" · ":"")+pickLat.toFixed(1)+"°, "+pickLon.toFixed(1)+"°"; drawMap(); }
  function openMap(){ pickLat=LAT;pickLon=LON; globeLon=-LON; globeLat=-LAT; globeZoom=1; setPick(LAT,LON); mapOverlay.classList.add("show"); }
  function closeMap(){ mapOverlay.classList.remove("show"); }
  document.getElementById("btnMap").addEventListener("click",openMap);
  document.getElementById("mapClose").addEventListener("click",closeMap);
  mapOverlay.addEventListener("click",(e)=>{ if(e.target===mapOverlay)closeMap(); });
  // drag to spin the globe; tap (no drag) to pick a location
  let gDrag=false,gMoved=false,gx0=0,gy0=0;
  function gStart(x,y){ gDrag=true;gMoved=false;gx0=x;gy0=y; }
  function gMove(x,y){ if(!gDrag)return; const dx=x-gx0,dy=y-gy0; if(Math.abs(dx)+Math.abs(dy)>4)gMoved=true; globeLon+=dx*0.5; globeLat=Math.max(-80,Math.min(80,globeLat+dy*0.5)); gx0=x;gy0=y; drawMap(); }
  function gEnd(x,y){ if(gDrag&&!gMoved){ const r=mapCanvas.getBoundingClientRect(); const sx=(x-r.left)/r.width*GS, sy=(y-r.top)/r.height*GS; const u=globeUnproject(sx,sy); if(u)setPick(u.lat,u.lon); } gDrag=false; }
  mapCanvas.addEventListener("mousedown",e=>gStart(e.clientX,e.clientY));
  window.addEventListener("mousemove",e=>gMove(e.clientX,e.clientY));
  window.addEventListener("mouseup",e=>{ if(gDrag)gEnd(e.clientX,e.clientY); });
  mapCanvas.addEventListener("touchstart",e=>{const t=e.touches[0];gStart(t.clientX,t.clientY);},{passive:true});
  mapCanvas.addEventListener("touchmove",e=>{const t=e.touches[0];gMove(t.clientX,t.clientY);},{passive:true});
  mapCanvas.addEventListener("touchend",e=>{const t=e.changedTouches[0];if(t)gEnd(t.clientX,t.clientY);},{passive:true});
  document.getElementById("mapGo").addEventListener("click",()=>{
    LAT=pickLat; LON=pickLon; PLACE_NAME=pickName; recomputeStars(); updateDynamic(nowJD()); closeMap();
  });
  // zoom: scroll wheel (desktop) + pinch (touch), clamped 1x (whole globe) .. 4x (~city level)
  mapCanvas.addEventListener("wheel",(e)=>{ e.preventDefault(); globeZoom=Math.max(1,Math.min(4, globeZoom*(e.deltaY>0?1.12:0.9))); drawMap(); },{passive:false});
  let gPinch=false, gPinchD0=0, gZoom0=1;
  function gTouchDist(e){ const a=e.touches[0],b=e.touches[1]; return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); }
  mapCanvas.addEventListener("touchstart",(e)=>{ if(e.touches.length===2){ gPinch=true; gPinchD0=gTouchDist(e); gZoom0=globeZoom; } },{passive:true});
  mapCanvas.addEventListener("touchmove",(e)=>{ if(gPinch&&e.touches.length===2){ const d=gTouchDist(e); globeZoom=Math.max(1,Math.min(4, gZoom0*(d/gPinchD0))); drawMap(); } },{passive:true});
  mapCanvas.addEventListener("touchend",(e)=>{ if(e.touches.length<2)gPinch=false; },{passive:true});

  // try live TLE fetch (hybrid); silently keep embedded fallback on failure
  (function tryLiveTLE(){ try{
    fetch("https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle").then(r=>r.text()).then(txt=>{
      const lines=txt.split(/\r?\n/); for(let i=0;i<lines.length-2;i++){ const nm=lines[i].trim();
        function parse(s,l1,l2){ s.incl=parseFloat(l2.substr(8,8)); s.raan=parseFloat(l2.substr(17,8)); s.M0=parseFloat(l2.substr(43,8)); s.n=parseFloat(l2.substr(52,11)); const ey=parseInt(l1.substr(18,2)); s.epochY=ey<57?2000+ey:1900+ey; s.epochD=parseFloat(l1.substr(20,12)); }
        if(/ISS/i.test(nm)&&lines[i+1]&&lines[i+1][0]==="1"){ parse(SATS[0],lines[i+1],lines[i+2]); }
        if(/CSS|TIANGONG/i.test(nm)&&lines[i+1]&&lines[i+1][0]==="1"){ parse(SATS[1],lines[i+1],lines[i+2]); }
      }
    }).catch(()=>{}); }catch(e){} })();

  function onResize(){ resizeCanvas(); layoutIcons(); }
  window.addEventListener("resize",onResize);
  window.addEventListener("orientationchange",onResize);

  resizeCanvas(); layoutIcons();
  updateDynamic(JD0);
  draw();
})();
