# Cloudflare Pages config for the whole site (project "cad").
# The functions/ directory deploys with it — that is the model shelf behind
# freyacad's one-click "Open in Bambu Studio" (see functions/api/shelf.js).
#
# The shelf needs a KV namespace, once:
#   npx wrangler kv namespace create SHELF
# then paste the id it prints over THE_KV_ID below. Until then the shelf
# answers 503 and freyacad quietly falls back to download-then-launch.
name = "cad"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "SHELF"
id = "THE_KV_ID"
